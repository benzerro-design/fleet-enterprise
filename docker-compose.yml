services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet-enterprise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - fleet_pg_data:/var/lib/postgresql/data

volumes:
  fleet_pg_data:
