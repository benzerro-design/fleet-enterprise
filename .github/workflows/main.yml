name: Deploy API to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE: fleet-api
      REGION: europe-west1
      AR_REGION: europe-west1
      REPO: fleet
      IMAGE: fleet-api

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /usr/share/gradle /usr/share/kotlin || true
          sudo docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --progress=plain -f api/Dockerfile \
            -t ${{ env.AR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            api

      - name: Push image
        run: |
          docker push ${{ env.AR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          # SMTP_* din GitHub Secrets (opțional). Fără ele, mailurile rămân stubbed —
          # nu montăm SMTP din Secret Manager (deploy eșua dacă secretele GCP lipseau).
          ENV_VARS="WEB_ORIGIN=${{ secrets.WEB_ORIGIN }},NODE_ENV=production,GCS_BUCKET=fleet-enterprise-trip-sheets,BOT_ENABLED=true,SMTP_HOST=smtp.gmail.com,SMTP_PORT=465,SMTP_SECURE=true"
          if [ -n "${{ secrets.SMTP_FROM }}" ]; then
            ENV_VARS="${ENV_VARS},SMTP_FROM=${{ secrets.SMTP_FROM }}"
          fi
          if [ -n "${{ secrets.SMTP_USER }}" ]; then
            ENV_VARS="${ENV_VARS},SMTP_USER=${{ secrets.SMTP_USER }}"
          fi
          if [ -n "${{ secrets.SMTP_PASS }}" ]; then
            ENV_VARS="${ENV_VARS},SMTP_PASS=${{ secrets.SMTP_PASS }}"
          fi
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.AR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest \
            --set-env-vars "${ENV_VARS}"
