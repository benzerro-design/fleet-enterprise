name: Deploy API to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE: fleet-api
      REGION: europe-west1
      AR_REGION: europe-west1
      REPO: fleet
      IMAGE: fleet-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Build pe Cloud Build (evită „No space left” pe runner-ul GitHub Actions).
      - name: Build and push image (Cloud Build)
        run: |
          set -euo pipefail
          IMAGE_URI="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          echo "Building ${IMAGE_URI}"
          gcloud builds submit api \
            --project="${PROJECT_ID}" \
            --tag="${IMAGE_URI}" \
            --timeout=1200s

      # Doar imaginea: env/secrets rămân pe serviciu (re-set le poate rupe deploy-ul).
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.AR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet
