name: Deploy API to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE: fleet-api
      REGION: europe-west1
      AR_REGION: europe-west1
      REPO: fleet
      IMAGE: fleet-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_REGION }}-docker.pkg.dev --quiet

      # Same style as web deploy: plain docker build/push (no Buildx GHA cache export).
      # Last run spent ~87s only exporting mode=max cache + 33s freeing disk.
      - name: Build image
        run: |
          set -euo pipefail
          IMAGE_URI="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          docker build -f api/Dockerfile -t "${IMAGE_URI}" api

      - name: Push image
        run: |
          set -euo pipefail
          IMAGE_URI="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          IMAGE_URI="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          echo "Deploying ${IMAGE_URI}"
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --image="${IMAGE_URI}" \
            --region="${REGION}" \
            --platform=managed \
            --quiet
