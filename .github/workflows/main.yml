name: Deploy API to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE: fleet-api
      REGION: europe-west1
      AR_REGION: europe-west1
      REPO: fleet
      IMAGE: fleet-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Async + poll: SA nu poate streama logurile din bucket-ul default Cloud Build,
      # iar `gcloud builds submit` (sync) ieșea cu exit 1 deși build-ul ajungea SUCCESS.
      - name: Build and push image (Cloud Build)
        run: |
          set -euo pipefail
          IMAGE_URI="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          echo "Building ${IMAGE_URI}"
          BUILD_ID="$(gcloud builds submit api \
            --project="${PROJECT_ID}" \
            --tag="${IMAGE_URI}" \
            --timeout=1200s \
            --async \
            --format='value(id)')"
          echo "Build ID: ${BUILD_ID}"
          for i in $(seq 1 150); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "poll=${i} status=${STATUS}"
            case "${STATUS}" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format=json || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for build ${BUILD_ID}"
          exit 1

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          IMAGE_URI="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          echo "Deploying ${IMAGE_URI}"
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --image="${IMAGE_URI}" \
            --region="${REGION}" \
            --platform=managed \
            --quiet
